<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPCSSIM - CS2 Major Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>FPCSSIM</h1>
      <p>IEM Cologne 2026 Swiss Stage Simulator</p>
    </header>

    <main>
      <section class="test-panel">
        <h2>System Status</h2>
        <button id="ping-btn">Ping Backend</button>
        <div id="status-display" class="status-box">Press button to test connection</div>
      </section>

      <section class="tournament-panel">
        <h2>IEM Cologne 2026 - Round 1</h2>
        <button id="init-btn">Generate Round 1 Matchups</button>
        <div id="bracket-display" class="bracket-grid"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>

</html>
